name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: setup go environment stable
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Install additional Packages for tests
        run: |
          sudo apt-get update
          sudo apt-get install -y hashdeep
        shell: bash
      - name: Run tests
        run: make test SKIP_GOLANGCI_LINT=1

  goreleaser:
    name: Publish release with GoReleaser
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create GitHub release and upload assets
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: setup go environment stable
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
